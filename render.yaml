services:
  - type: web
    name: solana-trojan-bot
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: JUPITER_API_URL
        value: https://quote-api.jup.ag/v6
      - key: PORT
        value: "3000"
      - key: LOG_LEVEL
        value: info
